<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="session-data" content='{"userid":"desarrollo","username":"Desarrollo Local","showAllSalesman":1}'>
  <meta name="theme-color" content="#0f1117">
  <title>Prospectos — ROGMAI (local)</title>
  <link rel="stylesheet" href="assets/app.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>
<body>
  <div id="offlineBanner" class="offline-banner" style="display:none">
    <span class="offline-dot"></span>
    <span id="offlineText">Sin conexión</span>
  </div>

  <main id="mainContent">
    <div id="view-panel"  class="view active"></div>
    <div id="view-lista"  class="view"></div>
    <div id="view-agenda" class="view"></div>
    <div id="view-mapa"   class="view"></div>
    <div id="view-perfil" class="view"></div>
    <div id="view-detalle" class="view"></div>
  </main>

  <button id="fabNuevo" class="fab" onclick="abrirNuevoProspecto()">+</button>

  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-item active" data-view="panel" onclick="PWA.navegarA('panel')">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <span>Panel</span>
    </button>
    <button class="nav-item" data-view="lista" onclick="PWA.navegarA('lista')">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1"/><circle cx="3" cy="12" r="1"/><circle cx="3" cy="18" r="1"/></svg>
      <span>Lista</span>
    </button>
    <button class="nav-item" data-view="agenda" onclick="PWA.navegarA('agenda')">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Agenda</span>
    </button>
    <button class="nav-item" data-view="mapa" onclick="PWA.navegarA('mapa')">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
      <span>Mapa</span>
    </button>
    <button class="nav-item" data-view="perfil" onclick="PWA.navegarA('perfil')">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Perfil</span>
    </button>
  </nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="assets/sync.js"></script>
  <script src="assets/map.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
